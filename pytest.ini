[pytest]
norecursedirs = tests/archive
markers =
    security: marks tests as security tests requiring ANTHROPIC_API_KEY (deselect with -m "not security")
    live: marks tests that require a real external API (real-Haiku-Integration, Re-ID-Rate measurement) — excluded from the deploy gate (-m "not live")
    perf: marks p95/latency/timing tests — excluded from the deploy gate (-m "not perf")
    rot_vor_fix: Diese Pruefung MUSS im ROT-Lauf vor dem Fix FAILED sein (Phase 08.23.2.SOFORT-2, Punkt 31 ROT-Beleg)
