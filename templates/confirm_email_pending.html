{% extends "base.html" %}
{% block content %}
<div style="max-width:480px;margin:80px auto;text-align:center;">
  <h2>Confirm your email</h2>
  <p>Please confirm your email address. We've sent you a confirmation link.</p>
  <p>
    <small>
      Didn't get the link?
      <button onclick="
        fetch('/auth/resend-confirm', {
          method: 'POST',
          headers: {
            'X-CSRFToken': (document.querySelector('meta[name=csrf-token]') || {}).content || ''
          }
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          alert(d.ok ? 'Email resent!' : 'Error: ' + d.error);
        })
        .catch(function() { alert('Failed to send. Please try again.'); });
      ">Resend</button>
    </small>
  </p>
  <p><a href="/auth/logout">Log out</a></p>
</div>
{% endblock %}
