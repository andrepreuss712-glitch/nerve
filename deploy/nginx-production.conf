# ── NERVE Production nginx-Konfiguration ─────────────────────────────────────
# Kopiere nach: /etc/nginx/sites-available/nerve
# Aktiviere:   ln -sf /etc/nginx/sites-available/nerve /etc/nginx/sites-enabled/nerve
# SSL-Certs:  certbot --nginx -d getnerve.app -d www.getnerve.app
# Hinweis: Diese Datei wird von deploy.sh via scp hochgeladen — NICHT inline im Heredoc.

server {
    listen 80;
    server_name getnerve.app www.getnerve.app;
    return 301 https://getnerve.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.getnerve.app;

    ssl_certificate     /etc/letsencrypt/live/getnerve.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getnerve.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://getnerve.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name getnerve.app;

    ssl_certificate     /etc/letsencrypt/live/getnerve.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getnerve.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Stripe webhook — raw body required for signature verification
    location /payments/webhook {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # WebSocket support for Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # All other requests
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
